[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py311","py313"]
include = '\.pyi?$'
exclude = '''
/(
  \.venv
 |build
 |dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
extend-select = ["I"]  # import sorting
